version: '3.8'

services:
  frontend:
    build:
      context: ../../
      dockerfile: docker/frontend/Dockerfile
      args:
        EXTERNAL_PORT: ${EXTERNAL_PORT:-3000}
        INTERNAL_PORT: ${INTERNAL_PORT:-3000}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${INTERNAL_PORT:-3000}
      HOSTNAME: "0.0.0.0"

      # API Configuration
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://demo-api-test.kgdigit.tech/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-wss://demo-api-test.kgdigit.tech}
      NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://demo-api-test.kgdigit.tech/files}
      NEXT_PUBLIC_UPLOAD_URL: ${NEXT_PUBLIC_UPLOAD_URL:-https://demo-api-test.kgdigit.tech/api/files}

      # Application Settings
      APP_NAME: ${APP_NAME:-TaskFlow}
      APP_ENV: ${APP_ENV:-production}

      # Feature Flags
      NEXT_PUBLIC_ENABLE_MAPS: ${NEXT_PUBLIC_ENABLE_MAPS:-true}
      NEXT_PUBLIC_ENABLE_REALTIME: ${NEXT_PUBLIC_ENABLE_REALTIME:-true}
      NEXT_PUBLIC_ENABLE_OFFLINE: ${NEXT_PUBLIC_ENABLE_OFFLINE:-true}

      # Optional integrations
      NEXT_PUBLIC_MAP_TOKEN: ${NEXT_PUBLIC_MAP_TOKEN}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      NEXT_PUBLIC_TELEGRAM_WEB_APP_URL: ${NEXT_PUBLIC_TELEGRAM_WEB_APP_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID}

    # Expose internal port for Coolify/Traefik reverse proxy
    expose:
      - "${INTERNAL_PORT:-3000}"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
