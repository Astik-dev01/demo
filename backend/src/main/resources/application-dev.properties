# Development Environment Configuration
# Uses environment variables from .env.dev file for flexible configuration

# Application Configuration
spring.application.name=taskflow
server.port=${INTERNAL_PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api

# External Database Configuration - uses environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow_demo_db}?currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USER:taskflow_demo_user}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration - development settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration - development mode with detailed logging
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:fuel_system_dev}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.placeholder-replacement=false

# Cache Configuration (Disabled for development)
# Cache functionality removed - using direct database operations for simplicity

# Async/Scheduling Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=4

# Internationalization
spring.messages.basename=LocalizationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=ru
spring.web.locale-resolver=fixed

# Swagger/OpenAPI Configuration - enhanced for development
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.deep-linking=true
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Security Configuration - uses environment variables
jwt.secret=${JWT_SECRET:bb78e42a7d4053a1a1517a614f6d639804206844ae1243d5ec9e92ffa2aaa3a7}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# QR Code Authentication Configuration
# QR tokens are reusable and effectively eternal (100 years = 52560000 minutes)
qr.token.expiration-minutes=52560000
qr.code.size=300
qr.frontend.url=${QR_FRONTEND_URL:https://demo-test.kgdigit.tech}
qr.frontend.login-path=/auth/login

# CORS Configuration - Development
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://demo-test.kgdigit.tech,https://demo-api-test.kgdigit.tech}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=512KB

# MinIO Configuration - external service through environment variables
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.username=${MINIO_USERNAME:minioadmin}
minio.password=${MINIO_PASSWORD:minioadmin123}
minio.secure=false
bucket.name=${BUCKET_NAME:taskflow-files}

# Actuator Configuration - expanded for development
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,configprops
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Support API Configuration
support.api.base-path=/taskflow

# Logging Configuration - minimal for development (no request logging)
logging.file.name=/app/logs/fuel_system/app.log
logging.level.root=INFO
logging.level.kg.bishkek.support=INFO
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.kg.bishkek.support.shared.config.AuditInterceptor=ERROR
logging.level.kg.bishkek.support.shared.service.impl.AuditLogServiceImpl=ERROR
logging.level.kg.bishkek.support.shared.config.ContentCachingFilter=ERROR
logging.level.org.springframework.web.servlet.resource=ERROR

# Application Info
info.app.name=Taskflow (Development)
info.app.description=Task Management System 
info.app.version=1.0.0-dev
info.app.encoding=UTF-8
info.app.java.version=21

# Audit Configuration
app.audit.enabled=true
app.audit.include-request-body=true
app.audit.include-response-body=true
app.audit.max-body-size=10000
app.audit.enable-request-logging=true
app.audit.cleanup.enabled=true
app.audit.cleanup.retention-days=90
app.audit.cleanup.schedule=0 2 * * * ?

# Route Access Control Configuration
app.route-access.enabled=true
app.route-access.cache-enabled=true
app.route-access.cache.scheduler.enabled=true
app.route-access.fallback-to-legacy=true
app.route-access.security-mode=hybrid

# Telegram Support Bot Configuration
telegram.bot.support.enabled=${TELEGRAM_SUPPORT_BOT_ENABLED:true}
telegram.bot.support.token=${TELEGRAM_SUPPORT_BOT_TOKEN:8473460150:AAEvMCS2doQqlYUFqGDM731kKOnqBhiynAk}
telegram.bot.support.username=${TELEGRAM_SUPPORT_BOT_USERNAME:retail_supports_bot}
telegram.bot.support.webhook-path=${TELEGRAM_SUPPORT_BOT_WEBHOOK_PATH:/api/taskflow/telegram/webhook}
telegram.bot.support.base-url=${TELEGRAM_SUPPORT_BOT_BASE_URL:https://demo-api-test.kgdigit.tech}
telegram.bot.support.token-expiration-hours=${TELEGRAM_SUPPORT_BOT_TOKEN_EXPIRATION_HOURS:24}
telegram.bot.support.employee-code-prefix=${TELEGRAM_SUPPORT_BOT_EMPLOYEE_CODE_PREFIX:GS}
telegram.bot.support.employee-code-length=${TELEGRAM_SUPPORT_BOT_EMPLOYEE_CODE_LENGTH:8}
telegram.bot.support.web-app-url=${TELEGRAM_SUPPORT_BOT_WEB_APP_URL:https://demo-test.kgdigit.tech}

# ========== Support System Module Configuration ==========
# SLA настройки
fuel.support.sla.critical.hours=2
fuel.support.sla.high.hours=4
fuel.support.sla.medium.hours=8
fuel.support.sla.low.hours=24
fuel.support.sla.check.interval=PT15M
fuel.support.sla.escalation.enabled=true

# Telegram бот настройки
fuel.support.telegram.enabled=${telegram.bot.support.enabled:true}
fuel.support.telegram.bot.username=${telegram.bot.support.username:}
fuel.support.telegram.bot.token=${telegram.bot.support.token:}
fuel.support.telegram.webhook.path=${telegram.bot.support.webhook-path:/api/telegram/webhook}
fuel.support.telegram.base.url=${telegram.bot.support.base-url:}
fuel.support.telegram.web.app.url=${telegram.bot.support.web-app-url:}

# WebSocket настройки
fuel.support.websocket.enabled=true
fuel.support.websocket.endpoint=/ws
fuel.support.websocket.allowed-origins=${cors.allowed.origins:*}

# File Storage настройки
fuel.support.file.storage.type=minio
fuel.support.file.storage.minio.endpoint=${minio.endpoint:http://localhost:9000}
fuel.support.file.storage.minio.username=${minio.username:minioadmin}
fuel.support.file.storage.minio.password=${minio.password:minioadmin}
fuel.support.file.storage.minio.bucket=${bucket.name:support-files}

