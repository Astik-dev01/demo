# Application Configuration
spring.application.name=taskflow
server.port=${INTERNAL_PORT:8081}
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow_db?currentSchema=taskflow_service_dev
spring.datasource.username=astanserikov
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.default_schema=fuel_system_dev

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.placeholder-replacement=false

# Cache Configuration (Disabled)
# Cache functionality removed - using direct database operations for simplicity

# Async/Scheduling Configuration
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=32
spring.task.execution.pool.queue-capacity=200
spring.task.scheduling.pool.size=8

# Internationalization
spring.messages.basename=LocalizationMessages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=ru
spring.web.locale-resolver=fixed

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.deep-linking=true
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Security Configuration
jwt.secret=bb78e42a7d4053a1a1517a614f6d639804206844ae1243d5ec9e92ffa2aaa3a7
# Access-token: 5 days
jwt.expiration=432000000
#Refresh-token: 5 days
jwt.refresh-expiration=432000000

# QR Code Authentication Configuration
# QR tokens are reusable and effectively eternal (100 years = 52560000 minutes)
qr.token.expiration-minutes=52560000
qr.code.size=300
qr.frontend.url=${QR_FRONTEND_URL:https://demo-test.kgdigit.tech}
qr.frontend.login-path=/auth/login

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://demo-test.kgdigit.tech,https://demo-api-test.kgdigit.tech,https://demo.kgdigit.tech,http://localhost:3001}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=512KB

# MinIO Configuration
minio.endpoint=https://minio.kgdigit.tech
minio.username=admin
minio.password=JZ9CEZXSYCC3b2q5A1ZHJBwTsCrecDhc
minio.secure=false
bucket.name=taskflow-files

# Actuator Configuration - expanded for development
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,configprops
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Support API Configuration
support.api.base-path=/taskflow

# Logging Configuration
logging.file.name=app.log
logging.level.root=INFO
logging.level.kg.bishkek.support=INFO
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=WARN
logging.level.com.zaxxer.hikari=WARN
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
logging.level.kg.bishkek.support.shared.config.AuditInterceptor=ERROR
logging.level.kg.bishkek.support.shared.service.impl.AuditLogServiceImpl=ERROR
logging.level.kg.bishkek.support.shared.config.ContentCachingFilter=ERROR
logging.level.org.springframework.web.servlet.resource=ERROR

# Log rotation configuration for production
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.max-history=30

# Audit Configuration
app.audit.enabled=true
app.audit.include-request-body=true
app.audit.include-response-body=true
app.audit.max-body-size=10000
app.audit.max-uri-size=1000
app.audit.enable-response-logging=true
app.audit.enable-request-logging=true
app.audit.cleanup.enabled=true
app.audit.cleanup.retention-days=90
app.audit.cleanup.schedule=0 2 * * * ?

