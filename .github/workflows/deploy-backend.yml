name: Deploy Backend

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  # Convert to lowercase for Docker compatibility
  IMAGE_NAME: ${{ github.repository_owner }}/taskflow-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_name: ${{ steps.lowercase.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert to lowercase
        id: lowercase
        run: |
          echo "image_name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GH_TOKEN,IMAGE_FULL,DB_PASSWORD,REDIS_PASSWORD,JWT_SECRET,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_USERNAME
          script: |
            echo "Logging in to GitHub Container Registry..."
            echo "$GH_TOKEN" | docker login ghcr.io -u github --password-stdin

            echo "Pulling latest image..."
            docker pull $IMAGE_FULL:latest

            echo "Stopping old container..."
            docker stop taskflow-backend || true
            docker rm taskflow-backend || true

            echo "Starting new container..."
            docker run -d \
              --name taskflow-backend \
              --network backend_taskflow-network \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=docker \
              -e INTERNAL_PORT=8080 \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://taskflow-postgres:5432/taskflow_db?currentSchema=taskflow \
              -e SPRING_DATASOURCE_USERNAME=taskflow \
              -e "SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD" \
              -e SPRING_DATA_REDIS_HOST=taskflow-redis \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e "SPRING_DATA_REDIS_PASSWORD=$REDIS_PASSWORD" \
              -e "JWT_SECRET=$JWT_SECRET" \
              -e MINIO_ENDPOINT=http://taskflow-minio:9000 \
              -e "MINIO_USERNAME=$MINIO_ACCESS_KEY" \
              -e "MINIO_PASSWORD=$MINIO_SECRET_KEY" \
              -e BUCKET_NAME=taskflow-files \
              -e MINIO_PUBLIC_URL=http://142.93.163.24:9000 \
              -e "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
              -e "TELEGRAM_BOT_USERNAME=$TELEGRAM_BOT_USERNAME" \
              $IMAGE_FULL:latest

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Waiting 60s for Spring Boot to start..."
            sleep 60

            echo "Checking health via docker exec..."

            # Wait up to 120 more seconds
            for i in {1..24}; do
              echo "Attempt $i/24..."

              # Check if container is running
              if ! docker ps | grep -q taskflow-backend; then
                echo "❌ Container is not running!"
                docker ps -a | grep taskflow
                docker logs taskflow-backend --tail 100
                exit 1
              fi

              # Check health from inside the container
              HEALTH=$(docker exec taskflow-backend curl -sf http://localhost:8080/api/actuator/health 2>/dev/null || echo "")

              if echo "$HEALTH" | grep -q '"status":"UP"'; then
                echo "✅ Deployment successful at $(date)"
                echo "Health: $HEALTH"
                docker ps | grep taskflow-backend
                exit 0
              fi

              echo "Response: ${HEALTH:-no response}"
              sleep 5
            done

            echo "❌ Health check failed after 180 seconds"
            echo "Container logs:"
            docker logs taskflow-backend --tail 100
            exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_FULL: ${{ needs.build-and-push.outputs.image_name }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
